name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android and API
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, azure]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release credential validation
        run: ./scripts/check-release-secrets.test.sh
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-36"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Test Android and verify public API
        run: ./gradlew :sdk:testAndroidHostTest :sdk:checkKotlinAbi
      - name: Compile consumer against published Android artifact
        run: ./scripts/check-android-artifact.sh

  apple:
    name: iOS and XCFramework
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test iOS and build XCFramework
        run: ./gradlew :sdk:iosSimulatorArm64Test :sdk:assemblePulsepondReleaseXCFramework
      - name: Package and compile Apple artifact consumer
        run: ./scripts/check-apple-artifact.sh
