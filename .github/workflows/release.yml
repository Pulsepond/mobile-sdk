name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    name: Publish native artifacts
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be v<semver> or <semver>." >&2
            exit 1
          fi
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
      - name: Test and build release artifacts
        run: ./gradlew :sdk:testAndroidHostTest :sdk:iosSimulatorArm64Test :sdk:checkKotlinAbi :sdk:assemblePulsepondReleaseXCFramework
      - name: Compile Swift consumer
        run: ./scripts/check-swift-api.sh
      - name: Package Apple artifact
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            sdk/build/XCFrameworks/release/Pulsepond.xcframework \
            Pulsepond.xcframework.zip
          shasum -a 256 Pulsepond.xcframework.zip > Pulsepond.xcframework.zip.sha256
      - name: Attach Apple artifact and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="Pulsepond.xcframework.zip"
          checksum="Pulsepond.xcframework.zip.sha256"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          archive_exists=false
          checksum_exists=false
          grep -Fxq "$archive" <<< "$assets" && archive_exists=true
          grep -Fxq "$checksum" <<< "$assets" && checksum_exists=true
          if [[ "$archive_exists" == true && "$checksum_exists" == true ]]; then
            mkdir existing-assets
            gh release download "$GITHUB_REF_NAME" \
              --pattern "$archive" \
              --pattern "$checksum" \
              --dir existing-assets
            cmp "$archive" "existing-assets/$archive"
            cmp "$checksum" "existing-assets/$checksum"
            echo "Existing release assets are byte-identical; continuing the retry."
          elif [[ "$archive_exists" == false && "$checksum_exists" == false ]]; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum"
          else
            echo "Release contains an incomplete Pulsepond XCFramework asset pair." >&2
            exit 1
          fi
      - name: Publish Android artifact to Maven Central
        run: ./gradlew :sdk:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
