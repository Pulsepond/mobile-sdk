name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    name: Publish native artifacts
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - name: Verify release credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
        run: ./scripts/check-release-secrets.sh
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be v<semver> or <semver>." >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Checked-out commit does not match the release tag." >&2
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_pulsepondVersion=$version" >> "$GITHUB_ENV"
          echo "PULSEPOND_RELEASE_COMMIT=$tag_commit" >> "$GITHUB_ENV"
      - name: Test and build release artifacts
        run: ./gradlew :sdk:testAndroidHostTest :sdk:iosSimulatorArm64Test :sdk:checkKotlinAbi :sdk:assemblePulsepondReleaseXCFramework
      - name: Package and compile Apple artifact consumer
        run: ./scripts/check-apple-artifact.sh build/release-assets "$PULSEPOND_RELEASE_COMMIT"
      - name: Attach immutable Apple artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          archive="Pulsepond.xcframework.zip"
          checksum="Pulsepond.xcframework.zip.sha256"
          provenance="Pulsepond.xcframework.zip.provenance.json"
          asset_dir="build/release-assets"
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          archive_exists=false
          checksum_exists=false
          provenance_exists=false
          grep -Fxq "$archive" <<< "$assets" && archive_exists=true
          grep -Fxq "$checksum" <<< "$assets" && checksum_exists=true
          grep -Fxq "$provenance" <<< "$assets" && provenance_exists=true
          if [[ "$archive_exists" == true && "$checksum_exists" == true && "$provenance_exists" == true ]]; then
            mkdir existing-assets
            gh release download "$RELEASE_TAG" \
              --pattern "$archive" \
              --pattern "$checksum" \
              --pattern "$provenance" \
              --dir existing-assets
            expected_sha="$(jq -er --arg commit "$PULSEPOND_RELEASE_COMMIT" \
              'select(.artifact == "Pulsepond.xcframework.zip" and .commit == $commit) | .sha256' \
              "existing-assets/$provenance")"
            checksum_sha="$(awk 'NR == 1 {print $1}' "existing-assets/$checksum")"
            actual_sha="$(shasum -a 256 "existing-assets/$archive" | awk '{print $1}')"
            if [[ ! "$expected_sha" =~ ^[0-9a-f]{64}$ || "$checksum_sha" != "$expected_sha" || "$actual_sha" != "$expected_sha" ]]; then
              echo "Existing Pulsepond XCFramework assets failed provenance verification." >&2
              exit 1
            fi
            echo "Existing release assets match this commit; continuing the retry."
          elif [[ "$archive_exists" == false && "$checksum_exists" == false && "$provenance_exists" == false ]]; then
            gh release upload "$RELEASE_TAG" \
              "$asset_dir/$archive" \
              "$asset_dir/$checksum" \
              "$asset_dir/$provenance"
          else
            echo "Release contains an incomplete Pulsepond XCFramework artifact set." >&2
            exit 1
          fi
      - name: Publish Android artifact to Maven Central
        run: ./gradlew :sdk:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
